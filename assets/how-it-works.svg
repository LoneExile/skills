<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title desc">
  <title id="title">How a skill works</title>
  <desc id="desc">1. Install: run npx skills add LoneExile/skills in a project, or add -g for all projects. 2. Choose: the CLI asks which skills you want and which agents get them, such as Claude Code, Codex, Cursor and OpenCode. 3. Ask: tell your agent what you want in plain words. 4. Get the file: the agent reads SKILL.md, runs the bundled script and saves the result.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .frame { fill: #f6f8fa; stroke: #d1d9e0; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .chip { fill: #eff2f5; }
    .bubble { fill: #ffffff; stroke-width: 1.5; }
    .h { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .body { font-size: 14px; fill: #1f2328; }
    .quote { font-size: 14px; font-style: italic; fill: #1f2328; }
    .note { font-size: 13px; fill: #59636e; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; fill: #1f2328; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .wire { stroke: #818b98; stroke-width: 2; fill: none; }
    .tip { fill: #818b98; }
    .check { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .f-blue { fill: #0969da; } .f-purple { fill: #8250df; } .f-orange { fill: #bc4c00; } .f-green { fill: #1a7f37; }
    .s-orange { stroke: #bc4c00; } .s-green { stroke: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #151b23; stroke: #3d444d; }
      .card { fill: #0d1117; stroke: #3d444d; }
      .chip { fill: #212830; }
      .bubble { fill: #0d1117; }
      .h, .body, .quote, .mono { fill: #f0f6fc; }
      .note { fill: #9198a1; }
      .num { fill: #0d1117; }
      .wire { stroke: #656c76; }
      .tip { fill: #656c76; }
      .f-blue { fill: #4493f8; } .f-purple { fill: #ab7df8; } .f-orange { fill: #db6d28; } .f-green { fill: #3fb950; }
      .s-orange { stroke: #db6d28; } .s-green { stroke: #3fb950; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="tip" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <rect class="frame" x="0.5" y="0.5" width="959" height="231" rx="14"/>

  <!-- 1 Install -->
  <rect class="card" x="24" y="24" width="204" height="184" rx="12"/>
  <circle class="f-blue" cx="52" cy="57" r="12"/>
  <text class="num" x="52" y="61.5" text-anchor="middle">1</text>
  <text class="h" x="72" y="62">Install</text>
  <rect class="chip" x="40" y="80" width="172" height="52" rx="8"/>
  <text class="mono" x="54" y="101">npx skills add</text>
  <text class="mono" x="54" y="121">LoneExile/skills</text>
  <text class="note" x="40" y="162">Run it in a project,</text>
  <text class="note" x="40" y="181">or add -g for all of them.</text>

  <line class="wire" x1="234" y1="116" x2="253" y2="116" marker-end="url(#arrow)"/>

  <!-- 2 Choose -->
  <rect class="card" x="260" y="24" width="204" height="184" rx="12"/>
  <circle class="f-purple" cx="288" cy="57" r="12"/>
  <text class="num" x="288" y="61.5" text-anchor="middle">2</text>
  <text class="h" x="308" y="62">Choose</text>
  <text class="body" x="276" y="98">The CLI asks which</text>
  <text class="body" x="276" y="118">skills you want and</text>
  <text class="body" x="276" y="138">which agents get them.</text>
  <text class="note" x="276" y="164">Claude Code, Codex,</text>
  <text class="note" x="276" y="183">Cursor, OpenCode, …</text>

  <line class="wire" x1="470" y1="116" x2="489" y2="116" marker-end="url(#arrow)"/>

  <!-- 3 Ask -->
  <rect class="card" x="496" y="24" width="204" height="184" rx="12"/>
  <circle class="f-orange" cx="524" cy="57" r="12"/>
  <text class="num" x="524" y="61.5" text-anchor="middle">3</text>
  <text class="h" x="544" y="62">Ask</text>
  <path class="bubble s-orange" d="M524 80 H672 A12 12 0 0 1 684 92 V138 A12 12 0 0 1 672 150 H550 L530 166 L536 150 H524 A12 12 0 0 1 512 138 V92 A12 12 0 0 1 524 80 Z"/>
  <text class="quote" x="526" y="103">“Make a 5-second</text>
  <text class="quote" x="526" y="121">clip of a red apple</text>
  <text class="quote" x="526" y="139">rolling.”</text>
  <text class="note" x="512" y="188">Plain words, no flags.</text>

  <line class="wire" x1="706" y1="116" x2="725" y2="116" marker-end="url(#arrow)"/>

  <!-- 4 Get the file -->
  <rect class="card" x="732" y="24" width="204" height="184" rx="12"/>
  <circle class="f-green" cx="760" cy="57" r="12"/>
  <text class="num" x="760" y="61.5" text-anchor="middle">4</text>
  <text class="h" x="780" y="62">Get the file</text>
  <text class="body" x="748" y="98">The agent reads</text>
  <text class="body" x="748" y="118">SKILL.md, then runs</text>
  <text class="body" x="748" y="138">the bundled script.</text>
  <rect class="chip" x="748" y="154" width="172" height="36" rx="8"/>
  <polyline class="check s-green" points="760,172 765,177 774,166"/>
  <text class="mono" x="782" y="177">apple.mp4</text>
  <text class="note" x="862" y="177">saved</text>
</svg>
