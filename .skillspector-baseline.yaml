#   skillspector baseline ./skills --no-llm -o .skillspector-baseline.yaml
# (then re-add the human reasons + keep the drift-tolerant rules below)
# See https://github.com/NVIDIA/SkillSpector/blob/main/docs/SUPPRESSION.md
