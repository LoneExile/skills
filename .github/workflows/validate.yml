name: Validate

on:
  push:
    branches: [main]
    paths: ["skills/**", "tests/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["skills/**", "tests/**", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Discover skills (validates SKILL.md frontmatter)
        run: npx -y skills add . --list

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile helper scripts
        run: |
          shopt -s nullglob globstar
          files=(skills/**/*.py)
          if [ ${#files[@]} -gt 0 ]; then
            python3 -m py_compile "${files[@]}"
            echo "Compiled ${#files[@]} script(s)."
          else
            echo "No Python helper scripts to check."
          fi

      - name: Check the shared code blocks are identical
        run: |
          set -euo pipefail
          block() { sed -n "/^# --- $1 (keep identical/,/^# --- end $1 ---\$/p" "$2"; }
          for name in "key lookup" "request safety"; do
            img=$(block "$name" skills/grok-image/grok_image.py)
            vid=$(block "$name" skills/grok-video/grok_video.py)
            if [ -z "$img" ] || [ -z "$vid" ]; then
              echo "::error::the '$name' block is missing from grok_image.py or grok_video.py"
              exit 1
            fi
            if [ "$img" != "$vid" ]; then
              echo "::error::the '$name' block differs between grok_image.py and grok_video.py"
              diff <(printf '%s\n' "$img") <(printf '%s\n' "$vid") || true
              exit 1
            fi
          done
          echo "Shared code blocks are identical."

      - name: Run helper-script tests
        run: |
          shopt -s nullglob
          dirs=(tests/*/)
          for d in "${dirs[@]}"; do python3 -m unittest discover -s "$d" -t "$d" -v; done
          echo "Ran tests in ${#dirs[@]} folder(s)."

      - name: Syntax-check JavaScript helper scripts
        run: |
          shopt -s nullglob globstar
          files=(skills/**/*.mjs skills/**/*.js)
          for f in "${files[@]}"; do node --check "$f"; done
          if [ ${#files[@]} -gt 0 ]; then
            echo "Checked ${#files[@]} script(s)."
          else
            echo "No JavaScript helper scripts to check."
          fi

  tests-py39:
    name: Helper-script tests (Python 3.9)
    # The oldest Python the helpers support (macOS ships 3.9). setup-python has no
    # 3.9 build for ubuntu-latest (26.04), so this job stays on 24.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Run helper-script tests on Python 3.9
        run: |
          shopt -s nullglob
          dirs=(tests/*/)
          for d in "${dirs[@]}"; do python -m unittest discover -s "$d" -t "$d" -v; done
          echo "Ran tests in ${#dirs[@]} folder(s) on Python 3.9."
