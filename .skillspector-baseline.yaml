# SkillSpector baseline — findings here are reviewed, intended behaviors of the
# skills in this repo and are suppressed on future scans. New/unexpected findings
# are NOT suppressed and surface in scans + the GitHub Security tab.
# Regenerate fingerprints when a skill's code changes:
#   skillspector baseline ./skills --no-llm -o .skillspector-baseline.yaml
# (then re-add the human reasons + keep the drift-tolerant rules below)
# See https://github.com/NVIDIA/SkillSpector/blob/main/docs/SUPPRESSION.md
version: 1

# Drift-tolerant glob rules (survive line/wording changes in docs).
rules:
  - id: "MP2"
    path: "terminal-demo-video/record.sh"
    reason: "False positive: the match is the script's own --help/usage comment block (the option list), not user-injected content or context-window stuffing."

